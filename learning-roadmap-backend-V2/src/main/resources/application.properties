spring.application.name=learning-roadmap-backend
server.port=${PORT:8080}

# Optional local .env file (gitignored). Copy .env.example to .env and fill it in.
spring.config.import=optional:file:./.env[.properties]

# ---- Database (secrets come from environment variables, never from git) ----
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/learning_roadmap?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# NOTE: "update" is fine for a learning project; use Flyway/Liquibase migrations in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Seed roles/skills (data.sql uses INSERT IGNORE, so it is safe to run on every start)
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ---- JWT ----
# Must be at least 32 characters. Generate one with: openssl rand -base64 48
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS (comma separated list of frontend origins) ----
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

logging.level.com.roadmap=INFO
